name: Fetch candidates

# GitHub's runners have open internet access; the Claude cloud sandbox does not.
# This workflow fetches the feeds and commits data/candidates/<date>.json so the
# daily routine always finds fresh candidates in the repository.

on:
  schedule:
    - cron: "15 */3 * * *"   # every 3 hours; 03:15 UTC run lands before the 04:00 routine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python3 pipeline/fetch.py
      - name: Commit candidates
        run: |
          git config user.name "ai-news-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Fetch candidates $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin main
          fi
